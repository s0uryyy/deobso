name: deobso checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_reports:
        description: 'Upload test reports (requires available artifact storage)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p tests test --no-daemon
      - name: Write test summary
        if: always()
        run: python3 dev/test_summary.py
      - name: Upload optional test reports
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_reports
        continue-on-error: true
        with:
          name: core-test-results
          path: tests/build/reports/tests/
          retention-days: 3
          compression-level: 9
          if-no-files-found: warn

  compile-fabric:
    # Avoid building twice for the push and pull_request events of the same commit.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Minecraft 1.21.1 Fabric
        run: ./gradlew -Dru.vidtu.ias.only=1.21.1-fabric :1.21.1-fabric:assemble --no-daemon
      - name: List built JARs (no artifact upload)
        run: find build/libs -maxdepth 1 -name '*.jar' -type f -print
