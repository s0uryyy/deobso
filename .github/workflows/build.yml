name: deobso checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_reports:
        description: 'Upload test reports (requires available artifact storage)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p tests test --no-daemon
      - name: Write test summary
        if: always()
        run: python3 dev/test_summary.py
      - name: Upload optional test reports
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_reports
        continue-on-error: true
        with:
          name: core-test-results
          path: tests/build/reports/tests/
          retention-days: 3
          compression-level: 9
          if-no-files-found: warn
