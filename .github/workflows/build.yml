name: deobso checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release_fallback:
        description: 'If JAR artifact upload fails, save files in a draft prerelease'
        type: boolean
        default: false
      upload_reports:
        description: 'Upload test reports (requires available artifact storage)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p tests test --no-daemon
      - name: Write test summary
        if: always()
        run: python3 dev/test_summary.py
      - name: Upload optional test reports
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_reports
        continue-on-error: true
        with:
          name: core-test-results
          path: tests/build/reports/tests/
          retention-days: 3
          compression-level: 9
          if-no-files-found: warn

  compile-fabric:
    permissions:
      contents: write
    # Avoid building twice for the push and pull_request events of the same commit.
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[matrix-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Minecraft 1.21.11 Fabric
        run: bash dev/build_target.sh 1.21.11-fabric
      - name: Check built JARs and generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/*1.21.11-fabric*.jar)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No Minecraft 1.21.11 Fabric JARs were produced" >&2
            exit 1
          fi
          (cd build/libs && sha256sum *1.21.11-fabric*.jar > SHA256SUMS.txt)
          printf '%s\n' "${jars[@]}"
      - name: Upload Minecraft 1.21.11 Fabric JARs
        id: jar_artifact
        uses: actions/upload-artifact@v4
        with:
          name: deobso-1.21.11-fabric
          path: |
            build/libs/*1.21.11-fabric*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save JARs in a draft release if artifact storage is unavailable
        # A marked push on the development branch also permits a one-off draft build
        # when the GitHub connection cannot dispatch workflows manually.
        if: >-
          failure() && steps.jar_artifact.outcome == 'failure' &&
          ((github.event_name == 'workflow_dispatch' && inputs.draft_release_fallback) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/arena/01a09a8b-deobso' &&
          contains(github.event.head_commit.message, '[draft-build]')))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="deobso-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          url=$(gh release create "$tag" build/libs/*1.21.11-fabric*.jar build/libs/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "deobso 1.21.11 Fabric — test build ${GITHUB_SHA:0:7}" \
            --notes "Test build from $GITHUB_SHA. Minecraft 1.21.11 / Fabric only. Built by GitHub Actions; in-game behavior is not verified. Saved here because Actions artifact upload failed. Includes SHA256SUMS.txt. This is an unpublished draft, not a stable release.")
          echo "JARs saved in draft release: $url" >> "$GITHUB_STEP_SUMMARY"
