name: Build and retain one Minecraft target
description: Compile a scoped target and save its JARs in an existing draft release
inputs:
  target:
    description: Minecraft version and loader
    required: true
  release_tag:
    description: Existing draft release tag
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v4
    - name: Compile requested version
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: bash dev/build_target.sh "$TARGET"
    - name: Save JARs and checksums
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        python3 dev/package_build.py "$TARGET"
        gh release upload "$RELEASE_TAG" build/packaged/* --repo "$GITHUB_REPOSITORY" --clobber
        echo "Built and uploaded **$TARGET** to draft release **$RELEASE_TAG**." >> "$GITHUB_STEP_SUMMARY"
    - name: Retain build log
      if: always()
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        if [ -f "build/ci-logs/$TARGET.log" ]; then
          gh release upload "$RELEASE_TAG" "build/ci-logs/$TARGET.log" --repo "$GITHUB_REPOSITORY" --clobber
        fi
